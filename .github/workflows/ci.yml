name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      # Tables are regenerated from the committed CSV; no S3 or external
      # data access needed. DVX .dvc files track provenance only.
      - run: uv run mdcmd -i README.md
      - name: Check README is up to date
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error::README.md is stale. Run 'uv run mdcmd -i README.md' locally and commit."
            exit 1
          fi

  dvx-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Check DVX-tracked artifacts are fresh
        run: |
          if ! uv run dvx status 2>&1 | tee /tmp/dvx-status.log; then
            echo "::error::dvx status failed"
            exit 1
          fi
          if grep -q "Stale:" /tmp/dvx-status.log && ! grep -q "Stale: 0" /tmp/dvx-status.log; then
            echo "::error::DVX-tracked artifacts are stale vs their .dvc provenance. Re-run the producing command and commit."
            exit 1
          fi

  test-ml:
    # Run the jax/levanter-dependent tests inside the marin subproject's
    # venv (already pins the full ML stack via [tool.uv.sources] git+SHA).
    # The root `test` job skips these tests via `pytest.importorskip("jax")`
    # because the root pyproject deliberately defers the heavy ML install;
    # this job picks them up using `tomat/marin/` as the venv root and
    # points pytest at `tests/` with `PYTHONPATH=src` so `tomat.*` imports
    # resolve. ~3-5 min on a cold CI runner (one-time wheel download +
    # JAX/HAX init).
    #
    # `VIRTUAL_ENV` is force-set to `marin/.venv` in every step because
    # `setup-uv@v5` exports `VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv` early,
    # which would route `uv sync` + `uv pip install` into the ROOT venv
    # (no ML deps) instead of `marin/.venv` (the one we want).
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/marin/.venv
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install marin ML stack
        working-directory: marin
        run: |
          uv sync
          uv pip install pytest
      - name: Run jax-dependent tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        working-directory: marin
        run: uv run --no-sync pytest ../tests/

  site-e2e:
    # Playwright e2e suite against the built site. Gates `deploy.yml` —
    # `deploy.yml` does NOT depend on this job at the GHA workflow level,
    # but the deploy-on-push semantics mean a failed e2e run blocks the
    # merge (and thus the push that triggers deploy) when this job is
    # required in branch protection. Hits R2 + workers.dev for run
    # manifests, so network egress in the CI runner matters; runs in
    # ~3-5 min as of bin5 baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --dir site exec playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: pnpm --dir site exec playwright test --reporter=line
      - name: Upload trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: site/test-results/
          retention-days: 7
