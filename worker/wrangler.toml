name = "tomat-runs-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
account_id = "43a6f2d588b1483733189d39418ec5be"

[[r2_buckets]]
binding = "R2"
bucket_name = "openathena"

[vars]
CORS_ORIGIN = "*"
R2_RUNS_PREFIX = "tomat/runs"
FILES_PREFIX = "tomat/,electrai/"

# ── staging deployment ─────────────────────────────────────────────────
# Same code + same R2 bucket, separate worker name so prod traffic isn't
# affected during iteration. Deploy via `pnpm --dir worker run deploy:staging`;
# live URL is `tomat-runs-api-staging.openathena.workers.dev`. Dev FE
# (`pnpm dev`) defaults to staging via `api.ts::DEV_DEFAULT_API_BASE`;
# `VITE_RUNS_API_BASE=…` or `?api=…` override that.
#
# `ALLOW_WRITE = "true"` is the killswitch for the `POST /api/eval/fire`
# + `GET /api/eval/fire-requests` endpoints. We deliberately leave it
# UNSET on the prod worker above so prod 405s every POST and 404s the
# listing — those routes are unauthenticated and any anon visitor could
# enumerate runs and queue real TPU spend via `autosync.sh`. Staging is
# the only live home for the write side until CFW Access (or equivalent)
# fronts the prod worker. See cb37232 + follow-up restore for context.
[env.staging]
name = "tomat-runs-api-staging"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "openathena"

[env.staging.vars]
CORS_ORIGIN = "*"
R2_RUNS_PREFIX = "tomat/runs"
FILES_PREFIX = "tomat/,electrai/"
ALLOW_WRITE = "true"
